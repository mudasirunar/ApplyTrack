  <!-- Synchronous Theme Initializer to prevent white flicker on load -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('applytrack_theme') || 'system';
      let themeToSet = savedTheme;
      if (savedTheme === 'system') {
        const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        themeToSet = isSystemDark ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', themeToSet);
      
      // Immediately set root background style to prevent any CSS-injection white flash
      const bgColor = themeToSet === 'dark' ? '#0E141C' : '#F7F8FA';
      document.documentElement.style.backgroundColor = bgColor;
      
      // Add no-transitions class to prevent initial load transition animations
      document.documentElement.classList.add('no-transitions');
    })();
  </script>

  <!-- FAQPage Schema for Search Engines and AI Crawlers (GEO / Generative Engine Optimization) -->

    {

        {
          "@type": "Question",
          "name": "How does the cloud synchronization between Android and the WebApp work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ApplyTrack uses an integrated dual-cloud synchronization model. Application metadata (job title, company, status pipeline, salary, platform, and notes) synchronizes instantly through Firebase Firestore, while physical document attachments (PDF resumes, cover letters, and document snapshots) are stored securely in Supabase Storage. Changes reflect across Android and Web in real-time."

          "@type": "Question",
          "name": "Where are my uploaded resumes stored, and are they private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your uploaded attachments are stored in your authenticated user directory within Supabase Storage (/users/{userId}/{type}/{fileName}). Access is strictly isolated to your authenticated account via secure token policies. ApplyTrack never shares, parses, or monetizes your resume data."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use the Android app without an internet connection?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The native ApplyTrack Android client is engineered with an offline-first architecture powered by local SQLite with Android Jetpack Room. You can record applications and view notes offline. When connectivity is restored, Android WorkManager automatically synchronizes changes."
          }
        },
        {
          "@type": "Question",
          "name": "How does ApplyTrack measure resume effectiveness?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Whenever you log an application, you can attach or tag the exact CV variation used. ApplyTrack computes callback rates, interview milestones, and offer conversions for each resume file, enabling you to identify which CV version generates the most recruiter response."
          }
        },
        {
          "@type": "Question",
          "name": "Can I export or backup all my application records and attachments?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, zero vendor lock-in. Under Settings, ApplyTrack offers a Full ZIP Archive Export that downloads your complete structured application JSON dataset alongside every original PDF resume and cover letter binary into an unencrypted ZIP archive."
          }
        },

          "@type": "Question",
          "name": "Is ApplyTrack free to use, and is it open source?",

          }
        }
      ]
    }
